<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#f6f7fb">

    <title>Vinay Electric Machinery</title>

    <!-- IMPORTANT: style.css must be in the SAME folder as index.html -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- =========================
         LOGIN SCREEN
    ========================== -->
    <div id="loginScreen" class="login-screen">

        <div class="login-card">

            <div class="login-logo">
                ⚡
            </div>

            <h1>Vinay Electric Machinery</h1>

            <p class="login-subtitle">
                Repair Shop Manager
            </p>

            <form id="loginForm">

                <div class="input-group">
                    <label>Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="primary-btn">
                    Login
                </button>

                <p id="loginError" class="error-message"></p>

            </form>

        </div>

    </div>


    <!-- =========================
         MAIN APPLICATION
    ========================== -->
    <div id="mainApp" class="main-app" style="display:none;">

        <!-- =========================
             HOME
        ========================== -->
        <section id="homeSection">

            <!-- TOP BAR -->
            <header class="top-bar">

                <div>
                    <div class="shop-title">
                        Vinay Electric Machinery
                    </div>

                    <div class="shop-location">
                        Dhariyawad
                    </div>
                </div>

                <button
                    class="top-search-btn"
                    onclick="openSearch()"
                    aria-label="Search"
                >
                    🔍
                </button>

            </header>


            <!-- HERO -->
            <section class="hero-section">

                <div class="hero-text">

                    <span class="hero-small">
                        REPAIR SHOP
                    </span>

                    <h2>
                        Manage your<br>
                        customers easily.
                    </h2>

                    <p>
                        Keep track of jobs, customers and collections.
                    </p>

                </div>

                <div class="hero-icon">
                    ⚡
                </div>

            </section>


            <!-- SHOP SWITCHER -->
            <section class="shop-switcher">

                <button
                    id="shop1Btn"
                    class="shop-btn active"
                    onclick="switchShop('Shop 1')"
                >
                    Shop 1
                </button>

                <button
                    id="shop2Btn"
                    class="shop-btn"
                    onclick="switchShop('Shop 2')"
                >
                    Shop 2
                </button>

            </section>


            <!-- STATS -->
            <section class="stats-grid">

                <div class="stat-card">
                    <div class="stat-icon">👥</div>

                    <div>
                        <span>Total Jobs</span>
                        <strong id="totalCustomers">0</strong>
                    </div>
                </div>


                <div class="stat-card">
                    <div class="stat-icon">₹</div>

                    <div>
                        <span>Total Amount</span>
                        <strong id="totalAmount">₹0</strong>
                    </div>
                </div>

            </section>


            <!-- SEARCH -->
            <section class="search-section">

                <div class="search-box">

                    <span>🔍</span>

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search customer, village, mobile..."
                        autocomplete="off"
                    >

                    <button
                        id="clearSearch"
                        type="button"
                        onclick="clearSearchInput()"
                    >
                        ×
                    </button>

                </div>

            </section>


            <!-- ADD CUSTOMER -->
            <section class="add-section">

                <button
                    class="add-customer-btn"
                    onclick="openAddCustomer()"
                >
                    <span class="plus-icon">+</span>

                    <span>
                        <strong>Add Customer</strong>
                        <small>New repair / service job</small>
                    </span>

                </button>

            </section>


            <!-- STATUS -->
            <div id="statusMessage" class="status-message"></div>


            <!-- CUSTOMER LIST -->
            <section class="customer-section">

                <div class="section-heading">

                    <div>
                        <span class="section-label">
                            CUSTOMER DIRECTORY
                        </span>

                        <h3>Recent Jobs</h3>
                    </div>

                </div>

                <div id="customerList" class="customer-list"></div>

            </section>

        </section>


        <!-- =========================
             ANALYSIS
             Created/filled by app.js
        ========================== -->
        <section
            id="analysisSection"
            class="analysis"
            style="display:none;"
        >
        </section>


        <!-- =========================
             BOTTOM NAVIGATION
        ========================== -->
        <nav id="appNav" class="bottom-nav">

            <button
                class="nav-item active"
                onclick="openHome()"
            >
                <span class="nav-icon">⌂</span>
                <span>Home</span>
            </button>


            <button
                class="nav-item"
                onclick="openAddCustomer()"
            >
                <span class="nav-icon">＋</span>
                <span>Add</span>
            </button>


            <button
                class="nav-item"
                onclick="openSearch()"
            >
                <span class="nav-icon">⌕</span>
                <span>Search</span>
            </button>


            <button
                class="nav-item"
                onclick="openAnalysis()"
            >
                <span class="nav-icon">▥</span>
                <span>Analysis</span>
            </button>


            <button
                class="nav-item"
                onclick="toggleMoreMenu()"
            >
                <span class="nav-icon">•••</span>
                <span>More</span>
            </button>

        </nav>


        <!-- =========================
             MORE MENU
        ========================== -->
        <div
            id="moreMenu"
            class="more-menu"
            style="display:none;"
        >

            <div class="more-menu-card">

                <button onclick="logoutUser()">
                    🚪 Logout
                </button>

                <button onclick="toggleMoreMenu()">
                    Cancel
                </button>

            </div>

        </div>

    </div>


    <!-- =========================
         CUSTOMER MODAL
    ========================== -->
    <div
        id="customerModal"
        class="modal-overlay"
        style="display:none;"
    >

        <div class="modal-card">

            <div class="modal-header">

                <div>
                    <span class="modal-label">
                        CUSTOMER
                    </span>

                    <h2 id="modalTitle">
                        Add Customer
                    </h2>
                </div>

                <button
                    class="modal-close"
                    onclick="closeCustomerModal()"
                >
                    ×
                </button>

            </div>


            <form id="customerForm">

                <input
                    type="hidden"
                    id="customerId"
                >


                <div class="form-group">

                    <label>Date</label>

                    <input
                        type="date"
                        id="customerDate"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Customer Name</label>

                    <input
                        type="text"
                        id="customerName"
                        placeholder="Customer name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Contact Number</label>

                    <input
                        type="tel"
                        id="customerMobile"
                        placeholder="Mobile number"
                    >

                </div>


                <div class="form-group">

                    <label>Village / Address</label>

                    <input
                        type="text"
                        id="customerVillage"
                        placeholder="Village or address"
                    >

                </div>


                <div class="form-group">

                    <label>Job Description</label>

                    <textarea
                        id="customerDescription"
                        placeholder="What repair/service was done?"
                        rows="3"
                    ></textarea>

                </div>


                <div class="form-group">

                    <label>Amount</label>

                    <input
                        type="number"
                        id="customerAmount"
                        placeholder="₹ Amount"
                        min="0"
                        step="1"
                    >

                </div>


                <button
                    type="submit"
                    class="primary-btn save-btn"
                >
                    Save Customer
                </button>

                <p
                    id="formError"
                    class="error-message"
                ></p>

            </form>

        </div>

    </div>


    <!-- =========================
         SUPABASE
    ========================== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- =========================
         APP JAVASCRIPT
    ========================== -->
    <script src="./app.js"></script>


    <!-- =========================
         SMALL UI HELPERS
    ========================== -->
    <script>

        function toggleMoreMenu() {

            const menu = document.getElementById("moreMenu");

            if (!menu) return;

            if (menu.style.display === "none" || menu.style.display === "") {
                menu.style.display = "flex";
            } else {
                menu.style.display = "none";
            }
        }


        document.addEventListener("click", function(event) {

            const menu = document.getElementById("moreMenu");

            if (!menu || menu.style.display === "none") {
                return;
            }

            const clickedInsideMenu =
                menu.contains(event.target);

            const clickedMoreButton =
                event.target.closest(
                    '[onclick="toggleMoreMenu()"]'
                );

            if (!clickedInsideMenu && !clickedMoreButton) {
                menu.style.display = "none";
            }

        });

    </script>

</body>
</html>
